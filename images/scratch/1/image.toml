schema = 1
family = "scratch"
line = "1"
version = "1"
id = "scratch-1"
package = "keeline-scratch"
publish = true
status = "stable"
platforms = ["linux/amd64", "linux/arm64"]

[tools.tino]
role = "init"
release = "0.1.40"
image = "ghcr.io/oksyd/tino:0.1.40@sha256:1604063f14b24f8ee7967eec56dee308fa58de1cf13397d48cbadb06a3de0365"
