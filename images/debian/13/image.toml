schema = 1
family = "debian"
line = "13"
version = "13"
distro = "trixie"
id = "debian-13"
package = "keeline-debian"
publish = true
status = "stable"
platforms = ["linux/amd64", "linux/arm64"]

[tools.tino]
role = "init"
release = "0.1.40"
image = "ghcr.io/oksyd/tino:0.1.40@sha256:1604063f14b24f8ee7967eec56dee308fa58de1cf13397d48cbadb06a3de0365"
source_path = "/sbin/tino"
target_path = "/sbin/tino"
entrypoint = ["/sbin/tino", "-g", "-s", "--"]

[tools.salus]
role = "healthcheck"
release = "0.1.12"
image = "ghcr.io/oksyd/salus:0.1.12@sha256:2d84e43cddb11352321b4e0e4ebf726ee4d9f7b9dc88c8102982ea0a74db5d86"
source_path = "/bin/salus"
target_path = "/bin/salus"

[tools.motdyn]
role = "motd"
release = "1.0.14"
image = "ghcr.io/lvillis/motdyn:1.0.14-slim@sha256:68eb88ae6031b08afaade56e04a0497f6139f80445bb6b3d27dc03a294ed1ef6"
source_path = "/usr/local/bin/motdyn"
target_path = "/usr/local/bin/motdyn"

[[variants]]
name = "default"
dockerfile = "Dockerfile"
base_image = "docker.io/library/debian:13"
title = "Keeline Debian 13"
description = "Keeline Debian 13 (trixie) base image"
command = ["bash"]
canonical = ["13"]
alias = ["trixie"]

[[variants]]
name = "slim"
dockerfile = "slim.Dockerfile"
base_image = "docker.io/library/debian:13-slim"
title = "Keeline Debian 13 Slim"
description = "Keeline Debian 13 (trixie) slim base image"
command = ["bash"]
canonical = ["13-slim"]
alias = ["trixie-slim"]
